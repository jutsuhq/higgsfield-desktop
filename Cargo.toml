[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/jutsuhq/higgsfield-desktop"
rust-version = "1.94"

[workspace.dependencies]
# Workspace crates
jutsu-core = { path = "crates/jutsu-core" }
higgsfield = { path = "crates/higgsfield" }
jutsu-providers = { path = "crates/jutsu-providers" }
jutsu-store = { path = "crates/jutsu-store" }
jutsu-media = { path = "crates/jutsu-media" }
jutsu-engine = { path = "crates/jutsu-engine" }
jutsu-agent = { path = "crates/jutsu-agent" }
jutsu-mcp = { path = "crates/jutsu-mcp" }
jutsu-app = { path = "crates/jutsu-app" }

# Runtime
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
futures = "0.3.34"
async-trait = "0.1.92"

# Data
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rust_decimal = { version = "1.43.0", features = ["serde"] }
uuid = { version = "1.29.2", features = ["v4", "serde"] }
time = { version = "0.3.55", features = ["serde", "formatting", "parsing"] }
url = { version = "2.5.8", features = ["serde"] }
unicode-normalization = "0.1.26"
sha2 = "0.11.1"

# Errors and logging
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

# I/O
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "migrate"] }
axum = "0.8.9"
tower-http = { version = "0.6.11", features = ["fs"] }
percent-encoding = "2.3.2"
keyring = "4.2.0"
interprocess = { version = "2.4.8", features = ["tokio"] }
trash = "5.2.9"

# IPC bindings
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.28", features = ["derive", "typescript"] }
specta-typescript = "0.0.15"

# Tauri
tauri = "2.12.5"
tauri-build = "2.7.4"
tauri-plugin-opener = "2.7.2"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-clipboard-manager = "2.5.0"

# Tests
wiremock = "0.6.5"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"

# Small debug info keeps the target directory and link times down.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false

# Dependencies are rarely stepped into: dropping their line tables shrinks target/ and speeds up linking.
[profile.dev.package."*"]
debug = false

# Shipping builds: one codegen unit and thin LTO for a smaller, faster binary. Panics keep unwinding,
# because spawn_blocking panics are turned into JoinError and shown, not allowed to abort the app.
[profile.release]
codegen-units = 1
lto = "thin"
strip = true
