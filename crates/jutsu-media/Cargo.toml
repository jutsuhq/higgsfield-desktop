[package]
name = "jutsu-media"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
jutsu-core.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
sha2.workspace = true
url.workspace = true
uuid.workspace = true
reqwest.workspace = true
# Not in the workspace dependencies.
# Decodes and encodes the common still formats (JPEG, PNG, TIFF, WebP, BMP, GIF); ffmpeg reads the rest.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "tiff", "webp", "bmp", "gif"] }
# Color conversion and ICC profiles (sRGB, Display P3); `image` depends on it already.
moxcms = "0.8.1"
# Git's blob hash of a model file; already in the lock file.
sha1 = "0.11.0"
# Unpacks the Real-ESRGAN release archive; already in the lock file.
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
# whisper.cpp, built from source, for subtitles made on this computer; only with the `whisper` feature, so the tests
# of the crates that don't enable it need no C++ build.
whisper-rs = { version = "=0.16.0", optional = true }

[features]
whisper = ["dep:whisper-rs"]

[dev-dependencies]
tempfile.workspace = true
wiremock.workspace = true
time.workspace = true

[lints]
workspace = true
