[package]
name = "jutsu-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
# `specta::Type` on the values that cross IPC to the UI.
specta = ["dep:specta"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rust_decimal.workspace = true
uuid.workspace = true
time.workspace = true
url.workspace = true
async-trait.workspace = true
futures.workspace = true
specta = { workspace = true, optional = true, features = ["uuid", "url", "rust_decimal"] }
# Not in the workspace dependencies; both are already in the lock file through other crates.
# Grapheme clusters: Swift counts and cuts text by `Character`.
unicode-segmentation = "1.13.3"
# Swift's `Data` fields are coded as base64 strings.
base64 = "0.22.1"

[dev-dependencies]
time = { workspace = true, features = ["macros"] }

[lints]
workspace = true
