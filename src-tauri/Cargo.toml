[package]
name = "jutsu-studio"
description = "Jutsu Studio for Windows and Linux"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "jutsu_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
jutsu-app.workspace = true
jutsu-core.workspace = true
tauri = { workspace = true, features = ["tray-icon"] }
tauri-specta.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-window-state.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-autostart.workspace = true
tauri-plugin-notification.workspace = true
tauri-plugin-updater.workspace = true
tauri-plugin-clipboard-manager.workspace = true
specta.workspace = true
specta-typescript.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
time = { workspace = true, features = ["local-offset"] }
uuid.workspace = true
tokio.workspace = true

# The WebKitGTK binding wry builds the window on, at its version and features, for the microphone setting.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[lints]
workspace = true

[features]
default = ["whisper"]
# whisper.cpp hears the subtitles. Build with `--no-default-features` where it does not compile; subtitles then
# offer no language.
whisper = ["jutsu-app/whisper"]
